name: Compilar y probar

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  # Arma Ajedrez.exe con Java incluido: se baja desde la pestana Actions (Artifacts > Ajedrez-windows).
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Armar el jar y juntar las dependencias
        run: mvn -B package -DskipTests dependency:copy-dependencies -DincludeScope=runtime
      - name: Armar Ajedrez.exe
        shell: bash
        run: |
          cp target/ajedrez-1.0.jar target/dependency/
          jpackage --type app-image --name Ajedrez --input target/dependency \
            --main-jar ajedrez-1.0.jar --main-class ajedrez.ui.Main --dest dist
      - name: Probar que abre
        shell: pwsh
        run: |
          $p = Start-Process dist/Ajedrez/Ajedrez.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Ajedrez.exe se cerro solo (codigo $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Ajedrez-windows
          path: dist/

  # Dibuja el diagrama de arquitectura (PlantUML) y lo deja en Artifacts > diagrama.
  diagrama:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Graphviz y PlantUML
        shell: bash
        run: |
          choco install graphviz -y --no-progress
          curl -sSLo plantuml.jar https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.7/plantuml-1.2024.7.jar
      - name: Dibujar
        shell: bash
        env:
          GRAPHVIZ_DOT: C:\Program Files\Graphviz\bin\dot.exe
        run: |
          java -DPLANTUML_LIMIT_SIZE=16384 -jar plantuml.jar -charset UTF-8 -stdrpt:1 -tpng -o "$PWD/dist" diagrama-arquitectura-completa/*.puml
          f=diagrama-arquitectura-completa/Arquitectura_Ajedrez_Completa.puml
          mkdir -p var
          sed -e 's/^@startuml .*/@startuml A_sin_ia_hacia_nucleo/' -e '/^GeneradorJugadas --> /d' -e '/^MotorMinimax \.\.> Tablero/d' $f > var/A.puml
          sed -e 's/^@startuml .*/@startuml B_sin_entradas_a_ia/' -e '/^ControladorJuego \.\.> AdaptadorMinimax/d' -e '/^ControladorJuego \.\.> MotorMinimax/d' -e '/^Juego \.\.> JugadorComputadora/d' -e '/^ConfiguracionPartida --> NivelIA/d' $f > var/B.puml
          sed -e 's/^@startuml .*/@startuml C_sin_cruces/' -e '/^GeneradorJugadas --> /d' -e '/^MotorMinimax \.\.> Tablero/d' -e '/^ControladorJuego \.\.> AdaptadorMinimax/d' -e '/^ControladorJuego \.\.> MotorMinimax/d' -e '/^Juego \.\.> JugadorComputadora/d' -e '/^ConfiguracionPartida --> NivelIA/d' $f > var/C.puml
          awk '/^package "ajedrez.ia/{skip=1} skip&&/^}/{skip=0; next} !skip' $f | grep -v -E '^(AdaptadorMinimax|MotorMinimax|GeneradorJugadas|ControladorJuego \.\.> (AdaptadorMinimax|MotorMinimax)|Juego \.\.> JugadorComputadora|ConfiguracionPartida --> NivelIA)' | sed 's/^@startuml .*/@startuml D_sin_paquete_ia/' > var/D.puml
          java -DPLANTUML_LIMIT_SIZE=16384 -jar plantuml.jar -charset UTF-8 -tpng -o "$PWD/dist" var/*.puml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagrama
          path: dist/
